name: Bug report
description: Report incorrect behaviour in retrieval, parsing, deduplication or PRISMA reporting
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Please redact any licensed full-text
        content before pasting an example — bibliographic metadata alone is
        enough to reproduce almost every defect found so far.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the software do, and what did you expect instead?
      placeholder: |
        Two records describing the same study were kept as separate records
        after deduplication.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: |
        The smallest input that still shows the behaviour, plus the code that
        processes it. For a deduplication problem, please give the **pair** of
        records that was or was not merged — the decision is always about a
        pair, so a single record cannot show it.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CorpusSLR version
      description: "Output of: python -c \"import corpusslr; print(corpusslr.__version__)\""
      placeholder: "1.3.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: "Output of: python --version"
      placeholder: "3.11.9"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the pipeline
      multiple: true
      options:
        - API source client (Scopus, OpenAlex, PubMed, Crossref, Semantic Scholar, arXiv, preprints, WoS)
        - Export parser (RIS, WoS tagged, .nbib, BibTeX, EndNote XML, CSV)
        - Query compilation
        - Deduplication
        - PRISMA 2020 flow / PRISMA-S appendix
        - Reproducible harvesting
        - Export or quality report
        - Command-line interface
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback, if any
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed any licensed full-text content from the example
          required: true
